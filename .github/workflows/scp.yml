name: scp

on:
  push:
    paths: ["scp/**", ".github/workflows/scp.yml"]
  pull_request:
    paths: ["scp/**", ".github/workflows/scp.yml"]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scp/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check scp tests ../examples
      - run: python -m pytest -q
      - name: Examples are reproducible
        run: python ../examples/build_examples.py && git diff --exit-code ../examples

  web:
    runs-on: ubuntu-latest
    needs: engine
    defaults: { run: { working-directory: scp/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: scp/web/package-lock.json }
      - run: pip install -e "../engine[dev]"
      - run: npm ci
      - name: API types match the engine (no drift)
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
