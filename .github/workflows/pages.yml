name: Publish SCP web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scp/web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scp/web/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build web client
        working-directory: scp/web
        env:
          VITE_API_ORIGIN: https://claude-versioned.onrender.com
        run: |
          npm ci
          npx tsc -b
          npx vite build --mode pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: scp/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
