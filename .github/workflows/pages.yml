name: Publish SCP web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scp/web/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Let an already submitted Pages deployment finish before starting the next.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 from 19 Oct 2026; move on purpose, once Playwright supports it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"   # October 21, 2026 security release; as the scp workflow
          cache: npm
          cache-dependency-path: scp/web/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build web client
        working-directory: scp/web
        env:
          VITE_API_ORIGIN: https://claude-versioned.onrender.com
        run: |
          npm ci
          npx tsc -b
          npx vite build --mode pages
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: scp/web/dist
      - name: Wait for the uploaded Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..12}; do
            if timeout 8s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq ".artifacts[] | select(.id == $ARTIFACT_ID and .expired == false) | .id" | grep -Fxq "$ARTIFACT_ID"; then
              echo "Pages artifact $ARTIFACT_ID is visible to the deployment API."
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become visible to the deployment API."
          exit 1
      - id: deployment
        name: Deploy the verified Pages artifact
        # deploy-pages lists artifacts through a separate results service, which can
        # return an empty list after the uploaded artifact is visible in the REST API.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { setTimeout: wait } = require("node:timers/promises");
            const deploymentRoute = "/repos/{owner}/{repo}/pages/deployments";
            const artifact = Number(process.env.ARTIFACT_ID);
            const oidc = await core.getIDToken();
            const { data: deployment } = await github.request(`POST ${deploymentRoute}`, {
              ...context.repo, artifact_id: artifact, pages_build_version: context.sha, oidc_token: oidc,
            }).catch((error) => {
              throw new Error(`Pages deployment could not start (HTTP ${error.status ?? "unavailable"}).`);
            });
            const deploymentId = deployment.id || deployment.status_url?.split("/").pop() || context.sha;
            const target = { ...context.repo, deploymentId };
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.request(`GET ${deploymentRoute}/{deploymentId}`, target).catch((error) => {
                if (error.status === 404 || error.status >= 500) return {};
                throw error;
              });
              if (data?.status === "succeed") {
                core.setOutput("page_url", deployment.page_url);
                core.info(`Deployment successful for ${context.sha}.`);
                return;
              }
              if (["deployment_failed", "deployment_content_failed", "deployment_cancelled", "deployment_lost"].includes(data?.status)) {
                throw new Error(`Pages deployment ended with status ${data.status}.`);
              }
              await wait(5000);
            }
            await github.request(`POST ${deploymentRoute}/{deploymentId}/cancel`, target).catch(() => {
              core.warning("The timed out Pages deployment could not be cancelled.");
            });
            throw new Error("Pages deployment did not finish within the polling window.");
